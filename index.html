<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Unlimited Cloud Drive by Hillzacky</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white shadow mb-6">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
                📁 Telegram Cloud Storage
            </h1>
            <div class="flex items-center gap-3">
                <input type="password" id="globalApiKey" placeholder="API Secret Key" class="border px-3 py-1.5 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="saveConfig()" class="bg-gray-800 text-white px-4 py-1.5 rounded text-sm hover:bg-gray-900 transition">Simpan Kunci</button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Sidebar: Manajemen Akun Bot & Upload -->
        <div class="space-y-6">
            
            <!-- Box Akun Bot -->
            <div class="bg-white shadow rounded-lg p-5">
                <h2 class="text-md font-semibold mb-3 text-gray-700">🤖 Pilih / Kelola Akun Bot</h2>
                <div class="space-y-3">
                    <select id="accountSelect" onchange="onAccountChange()" class="w-full border px-3 py-2 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">-- Pilih Akun Bot --</option>
                    </select>
                    <button onclick="openLoginModal()" class="w-full bg-blue-50 text-blue-600 border border-blue-200 py-1.5 rounded text-xs font-semibold hover:bg-blue-100 transition">+ Tambah Akun Baru</button>
                </div>
            </div>

            <!-- Box Upload File -->
            <div class="bg-white shadow rounded-lg p-5">
                <h2 class="text-md font-semibold mb-3 text-gray-700">📤 Upload File</h2>
                <input type="file" id="fileInput" class="block w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 mb-3"/>
                <button onclick="uploadFile()" class="w-full bg-green-600 text-white py-2 rounded text-sm font-medium hover:bg-green-700 transition">Kirim ke Telegram</button>
            </div>

        </div>

        <!-- Konten Utama: File Manager & Grid File -->
        <div class="lg:col-span-3 space-y-6">
            
            <!-- Panel Pencarian & Filter -->
            <div class="bg-white shadow rounded-lg p-5 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                    <input type="text" id="searchQuery" placeholder="Cari nama file..." class="border px-3 py-2 rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none w-full sm:w-64">
                    <select id="filterExt" class="border px-3 py-2 rounded text-sm outline-none">
                        <option value="all">Semua Format</option>
                        <option value="pdf">PDF</option>
                        <option value="jpg">JPG / Gambar</option>
                        <option value="mp4">MP4 / Video</option>
                        <option value="zip">ZIP / Arsip</option>
                    </select>
                </div>
                <button onclick="loadFiles()" class="w-full sm:w-auto bg-blue-600 text-white px-5 py-2 rounded text-sm font-medium hover:bg-blue-700 transition">Cari / Filter</button>
            </div>

            <!-- Grid Tampilan File dengan Thumbnail -->
            <div class="bg-white shadow rounded-lg p-5">
                <div class="flex justify-between items-center mb-4 border-b pb-3">
                    <h2 class="text-md font-semibold text-gray-700">Daftar Berkas</h2>
                    <span id="fileCountBadge" class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full font-medium">0 file</span>
                </div>

                <!-- Grid Container -->
                <div id="fileGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <div class="col-span-full text-center py-10 text-gray-400 text-sm">
                        Silakan masukkan API Key, pilih akun bot, lalu muat data.
                    </div>
                </div>

                <!-- Pagination Sederhana -->
                <div class="flex justify-between items-center mt-6 pt-4 border-t text-sm">
                    <button onclick="changePage(-1)" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Sebelumnya</button>
                    <span id="pageIndicator" class="text-gray-600">Halaman 1 / 1</span>
                    <button onclick="changePage(1)" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Berikutnya</button>
                </div>
            </div>

        </div>

    </div>

    <!-- Modal Login Akun Bot -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-lg max-w-md w-full p-6 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-gray-800">Daftarkan Akun Bot Telegram</h3>
            <div>
                <label class="text-xs font-semibold text-gray-600">Account ID (Alias Bebas, Cth: utama)</label>
                <input type="text" id="modalAccountId" class="w-full border px-3 py-2 rounded text-sm mt-1 outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-600">Bot Token (Dari BotFather)</label>
                <input type="text" id="modalBotToken" class="w-full border px-3 py-2 rounded text-sm mt-1 outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-600">Chat / Channel ID (Cth: -100xxxxxxx)</label>
                <input type="text" id="modalChatId" class="w-full border px-3 py-2 rounded text-sm mt-1 outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeLoginModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded text-sm">Batal</button>
                <button onclick="submitLogin()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">Simpan & Login</button>
            </div>
        </div>
    </div>

    <!-- Skrip Logika Frontend -->
    <script>
        // Sesuaikan dengan URL Cloudflare Worker Anda
        const WORKER_URL = "https://telegram-storage.nama-anda.workers.dev";
        let currentPage = 1;

        window.onload = () => {
            const savedKey = localStorage.getItem('tg_api_key');
            if (savedKey) {
                document.getElementById('globalApiKey').value = savedKey;
                fetchAccounts();
            }
        };

        function saveConfig() {
            const key = document.getElementById('globalApiKey').value;
            localStorage.setItem('tg_api_key', key);
            alert('API Key berhasil disimpan di browser!');
            fetchAccounts();
        }

        async function fetchAccounts() {
            const apiKey = document.getElementById('globalApiKey').value;
            if (!apiKey) return;

            try {
                const res = await fetch(`${WORKER_URL}/accounts`, {
                    headers: { 'Authorization': `Bearer ${apiKey}` }
                });
                const result = await res.json();
                if (result.success) {
                    const select = document.getElementById('accountSelect');
                    select.innerHTML = '<option value="">-- Pilih Akun Bot --</option>';
                    result.data.forEach(acc => {
                        select.innerHTML += `<option value="${acc.account_id}">${acc.account_id} (@${acc.bot_name})</option>`;
                    });
                }
            } catch (err) {
                console.g("Gagal memuat akun:", err);
            }
        }

        function onAccountChange() {
            currentPage = 1;
            loadFiles();
        }

        async function loadFiles() {
            const apiKey = document.getElementById('globalApiKey').value;
            const accountId = document.getElementById('accountSelect').value;
            const search = document.getElementById('searchQuery').value;
            const filter = document.getElementById('filterExt').value;

            if (!apiKey || !accountId) return;

            let url = `${WORKER_URL}/files?account_id=${accountId}&filter=${filter}&page=${currentPage}&maxview=12`;
            if (search) url += `&search=${encodeURIComponent(search)}`;

            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${apiKey}` } });
                const result = await res.json();

                if (result.success) {
                    renderFiles(result.data, result.pagination);
                }
            } catch (err) {
                alert('Gagal memuat daftar file: ' + err.message);
            }
        }

        function renderFiles(files, pagination) {
            const grid = document.getElementById('fileGrid');
            document.getElementById('fileCountBadge').innerText = `${pagination.total_items} file`;
            document.getElementById('pageIndicator').innerText = `Halaman ${pagination.page} / ${pagination.total_pages}`;
            grid.innerHTML = '';

            if (files.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 text-sm">Tidak ada file ditemukan.</div>`;
                return;
            }

            const apiKey = document.getElementById('globalApiKey').value;
            const accountId = document.getElementById('accountSelect').value;

            files.forEach(file => {
                const sizeMb = (file.file_size / (1024 * 1024)).toFixed(2);
                const isImage = ['jpg', 'jpeg', 'png', 'webp'].includes(file.extension);
                
                // Jika memiliki thumbnail, arahkan ke endpoint download dengan type=thumb
                const thumbUrl = (isImage && file.thumb_file_id) 
                    ? `${WORKER_URL}/download?account_id=${accountId}&file_id=${file.file_id}&type=thumb` 
                    : null;

                const card = document.createElement('div');
                card.className = "border rounded-lg p-4 bg-gray-50 flex flex-col justify-between shadow-sm hover:shadow transition";
                card.innerHTML = `
                    <div>
                        <div class="h-32 bg-gray-200 rounded mb-3 flex items-center justify-center overflow-hidden relative">
                            ${thumbUrl ? `<img src="${thumbUrl}" class="object-cover w-full h-full" alt="thumbnail">` : `<span class="text-xs uppercase font-bold text-gray-500">${file.extension}</span>`}
                        </div>
                        <h3 class="font-semibold text-sm text-gray-800 truncate" title="${file.file_name}">${file.file_name}</h3>
                        <p class="text-xs text-gray-500 mt-1">${sizeMb} MB • ${file.extension.toUpperCase()}</p>
                    </div>
                    <div class="flex justify-between items-center mt-4 pt-3 border-t text-xs">
                        <a href="${WORKER_URL}/download?account_id=${accountId}&file_id=${file.file_id}" target="_blank" class="text-blue-600 font-medium hover:underline">Unduh</a>
                        <button onclick="renameFile('${file.file_id}', '${file.file_name}')" class="text-yellow-600 hover:underline">Rename</button>
                        <button onclick="deleteFile('${file.file_id}')" class="text-red-600 hover:underline">Hapus</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function uploadFile() {
            const apiKey = document.getElementById('globalApiKey').value;
            const accountId = document.getElementById('accountSelect').value;
            const fileInput = document.getElementById('fileInput').files[0];

            if (!apiKey || !accountId || !fileInput) {
                alert('Pilih akun bot dan berkas terlebih dahulu!');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput);
            formData.append('account_id', accountId);

            alert('Mengunggah file ke Telegram... Mohon tunggu.');

            try {
                const res = await fetch(`${WORKER_URL}/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKey}` },
                    body: formData
                });
                const result = await res.json();
                if (result.success) {
                    alert('File berhasil diunggah!');
                    document.getElementById('fileInput').value = '';
                    loadFiles();
                } else {
                    alert('Gagal: ' + result.error);
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function deleteFile(fileId) {
            if (!confirm('Hapus file ini secara permanen dari sistem dan Telegram?')) return;
            const apiKey = document.getElementById('globalApiKey').value;

            try {
                const res = await fetch(`${WORKER_URL}/files`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ file_id: fileId })
                });
                const result = await res.json();
                if (result.success) {
                    loadFiles();
                } else {
                    alert('Gagal menghapus: ' + result.error);
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function renameFile(fileId, oldName) {
            const newName = prompt('Masukkan nama file baru:', oldName);
            if (!newName || newName === oldName) return;
            const apiKey = document.getElementById('globalApiKey').value;

            try {
                const res = await fetch(`${WORKER_URL}/files`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ file_id: fileId, new_file_name: newName })
                });
                const result = await res.json();
                if (result.success) {
                    loadFiles();
                } else {
                    alert('Gagal rename: ' + result.error);
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            loadFiles();
        }

        function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

        async function submitLogin() {
            const apiKey = document.getElementById('globalApiKey').value;
            const account_id = document.getElementById('modalAccountId').value;
            const bot_token = document.getElementById('modalBotToken').value;
            const chat_id = document.getElementById('modalChatId').value;

            if (!apiKey || !account_id || !bot_token || !chat_id) {
                alert('Semua kolom wajib diisi!');
                return;
            }

            try {
                const res = await fetch(`${WORKER_URL}/account/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ account_id, bot_token, chat_id })
                });
                const result = await res.json();
                if (result.success) {
                    alert(result.message);
                    closeLoginModal();
                    fetchAccounts();
                } else {
                    alert('Gagal login: ' + result.error);
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
    </script>
</body>
</html>
